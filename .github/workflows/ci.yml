name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run gates
      - run: bun run test:unit
      - run: bun run pack:check
      - name: Install Playwright browsers (Chromium & WebKit)
        run: bunx playwright install --with-deps chromium webkit
      - run: bun run test:browser
