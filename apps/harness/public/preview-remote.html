<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Remote Preview App</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #ffffff;
        color: #111827;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        background: #dcfce7;
        color: #166534;
        font-size: 12px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <span class="badge">Remote bridge-less preview</span>
    <h1 id="remote-heading">Remote route: /</h1>
    <script>
      const params = new URLSearchParams(location.search);
      const path = params.get("path") || "/";
      document.getElementById("remote-heading").textContent = "Remote route: " + path;
      document.title = "Remote " + path;
    </script>
  </body>
</html>
